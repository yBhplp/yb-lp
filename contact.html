<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>無料相談・資料請求 | KUSABI</title>
<style>
  :root{
    --ink:#0A0E1F; --ink-2:#111830; --ink-3:#161f3d;
    --text:#F2F4FA; --text-dim:#8B93AC;
    --cyan:#4DE3F0; --cyan-2:#3AA9E0; --blue:#3D6FF2;
    --bad:#F2748A;
    --font-disp:-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic Medium', 'Yu Gothic', Meiryo, sans-serif;
    --font-body:-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic Medium', 'Yu Gothic', Meiryo, sans-serif;
    --font-num:-apple-system, BlinkMacSystemFont, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', 'Yu Gothic Medium', 'Yu Gothic', Meiryo, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:var(--font-body); background:var(--ink); color:var(--text);
    line-height:1.85; -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  a{color:inherit;}
  .wrap{ max-width:720px; margin:0 auto; padding:64px 32px 100px; }
  @media (max-width:600px){ .wrap{ padding:48px 20px 80px; } }

  .blob{ position:fixed; border-radius:50%; filter:blur(80px); opacity:0.28; pointer-events:none; z-index:0; }
  @keyframes drift{ 0%,100%{ transform:translate(0,0); } 50%{ transform:translate(24px,-20px); } }
  @media (prefers-reduced-motion:no-preference){ .blob{ animation:drift 18s ease-in-out infinite; } }

  /* ---------- custom cursor ---------- */
  body.has-cursor, body.has-cursor a, body.has-cursor button{ cursor:none; }
  #cur-dot, #cur-ring{
    position:fixed; left:0; top:0; z-index:200;
    pointer-events:none; border-radius:50%;
    transform:translate(-50%,-50%); will-change:transform;
  }
  #cur-dot{ width:6px; height:6px; background:var(--cyan); transition:width .18s ease, height .18s ease; }
  #cur-ring{
    width:34px; height:34px; border:1px solid rgba(77,227,240,0.55);
    transition:width .25s cubic-bezier(.2,.8,.2,1), height .25s cubic-bezier(.2,.8,.2,1), border-color .25s ease, background .25s ease;
  }
  body.cur-hover #cur-ring{ width:56px; height:56px; background:rgba(77,227,240,0.1); border-color:var(--cyan); }
  body.cur-hover #cur-dot{ width:0; height:0; }
  @media (hover:none), (pointer:coarse){ #cur-dot, #cur-ring{ display:none; } }
  @media (prefers-reduced-motion:reduce){
    body.has-cursor{ cursor:auto; }
    #cur-dot, #cur-ring{ display:none; }
    .blob{ animation:none; }
  }

  .logo{ display:flex; align-items:center; position:relative; z-index:1; }
  .logo-img{ height:19px; width:auto; display:block; }
  .eyebrow{ font-family:var(--font-num); font-weight:700; font-size:12px; letter-spacing:0.14em; text-transform:uppercase; color:var(--cyan); }
  h1{ font-family:var(--font-disp); font-weight:900; font-size:clamp(26px,4vw,36px); line-height:1.5; margin-top:18px; }
  .lead{ margin-top:16px; font-size:15px; color:var(--text-dim); max-width:56ch; }

  form{ position:relative; z-index:1; margin-top:44px; display:flex; flex-direction:column; gap:26px; }
  .field{ display:flex; flex-direction:column; gap:9px; }
  .field label{ font-size:13.5px; font-weight:700; }
  .field label .req{ color:var(--cyan); font-weight:400; font-size:11px; margin-left:6px; }
  .field label .opt{ color:var(--text-dim); font-weight:400; font-size:11px; margin-left:6px; }
  input[type=text], input[type=email], input[type=tel], textarea{
    font-family:var(--font-body); font-size:14.5px; color:var(--text);
    background:var(--ink-2); border:1px solid rgba(255,255,255,0.12); border-radius:10px;
    padding:13px 14px; outline:none; transition:border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder, textarea::placeholder{ color:rgba(139,147,172,0.6); }
  input:focus, textarea:focus{ border-color:var(--cyan); box-shadow:0 0 0 3px rgba(77,227,240,0.15); }
  textarea{ resize:vertical; min-height:120px; font-family:var(--font-body); line-height:1.7; }

  .chip-select{ display:flex; flex-wrap:wrap; gap:10px; }
  .chip-toggle{
    font-family:var(--font-body); font-size:13.5px; color:var(--text-dim);
    background:var(--ink-2); border:1px solid rgba(255,255,255,0.14); border-radius:999px;
    padding:11px 18px; cursor:pointer; transition:all .18s ease; user-select:none;
  }
  .chip-toggle:hover{ border-color:rgba(77,227,240,0.4); color:var(--text); }
  .chip-toggle.on{ background:rgba(77,227,240,0.12); border-color:var(--cyan); color:var(--cyan); font-weight:700; }
  .chip-hint{ font-size:12px; color:var(--text-dim); }

  .pill{
    font-family:var(--font-body); font-weight:700; font-size:14.5px;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:16px 26px; border-radius:999px; border:none; cursor:pointer;
    background:var(--cyan); color:var(--ink);
    transition:transform .2s ease, background .2s ease, opacity .2s ease;
  }
  .pill:hover{ transform:translateY(-2px); background:#6EEBF5; }
  .pill:disabled{ opacity:0.5; cursor:not-allowed; transform:none; }
  .privacy-note{ font-size:12px; color:var(--text-dim); }

  .form-msg{ display:none; margin-top:18px; padding:16px 18px; border-radius:12px; font-size:14px; }
  .form-msg.show{ display:block; }
  .form-msg.ok{ background:rgba(77,227,240,0.1); border:1px solid rgba(77,227,240,0.35); color:var(--text); }
  .form-msg.err{ background:rgba(242,116,138,0.1); border:1px solid rgba(242,116,138,0.4); color:var(--text); }

  .thankyou{ display:none; position:relative; z-index:1; margin-top:44px; }
  .thankyou.show{ display:block; }
  .thankyou h2{ font-family:var(--font-disp); font-weight:900; font-size:24px; }
  .thankyou p{ margin-top:14px; font-size:14.5px; color:var(--text-dim); }

  .back{ display:inline-block; margin-top:40px; font-size:13px; color:var(--text-dim); text-decoration:none; position:relative; z-index:1; }
  .back:hover{ color:var(--cyan); }
  .footlinks{ margin-top:20px; display:flex; gap:20px; flex-wrap:wrap; font-size:12.5px; position:relative; z-index:1; }
  .footlinks a{ color:var(--text-dim); text-decoration:none; }
  .footlinks a:hover{ color:var(--cyan); }
  .plan-note{ display:none; margin-top:20px; padding:12px 16px; border-radius:10px; font-size:13.5px; background:rgba(77,227,240,0.1); border:1px solid rgba(77,227,240,0.3); color:var(--text); }
  .plan-note.show{ display:block; }
</style>
</head>

  <span class="eyebrow" style="display:block; margin-top:28px;">Contact</span>
  <h1>無料相談・資料請求</h1>
  <p class="lead">現状のお悩みを30分ほどヒアリングした上で、貴社に合った内容をご提案します。資料だけ先に見てみたい、という場合も大歓迎です。</p>
  <p class="plan-note" id="planNote"></p>

  <form id="contactForm" action="https://formsubmit.co/info@ybinc.co.jp" method="POST">
    <input type="hidden" name="_subject" value="【yB】Webサイトからのお問い合わせ">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_next" id="nextInput" value="">
    <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
    <input type="hidden" name="ご検討中のプラン" id="planInput" value="">

    <div class="field">
      <label for="company">会社名 <span class="req">必須</span></label>
      <input type="text" id="company" name="会社名" placeholder="株式会社〇〇" required>
    </div>

    <div class="field">
      <label for="name">ご担当者名 <span class="req">必須</span></label>
      <input type="text" id="name" name="ご担当者名" placeholder="山田 太郎" required>
    </div>

    <div class="field">
      <label for="email">メールアドレス <span class="req">必須</span></label>
      <input type="email" id="email" name="メールアドレス" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label for="tel">電話番号 <span class="opt">任意</span></label>
      <input type="tel" id="tel" name="電話番号" placeholder="090-0000-0000">
    </div>

    <div class="field">
      <label for="address">ご住所 <span class="opt">任意</span></label>
      <input type="text" id="address" name="ご住所" placeholder="福岡県福岡市〇〇区…">
    </div>

    <div class="field">
      <label>どんなことでお困りですか？ <span class="req">必須・複数選択可</span></label>
      <div class="chip-select" id="interestSelect">
        <button type="button" class="chip-toggle" data-value="施工事例・現場の動画を作りたい">施工事例・現場の動画を作りたい</button>
        <button type="button" class="chip-toggle" data-value="SNS発信を強化したい">SNS発信を強化したい</button>
        <button type="button" class="chip-toggle" data-value="採用向けの発信をしたい">採用向けの発信をしたい</button>
        <button type="button" class="chip-toggle" data-value="LP・HPを整えたい">LP・HPを整えたい</button>
        <button type="button" class="chip-toggle" data-value="3Dモデリング・パースを相談したい">3Dモデリング・パースを相談したい</button>
        <button type="button" class="chip-toggle" data-value="まずは資料だけ見てみたい">まずは資料だけ見てみたい</button>
        <button type="button" class="chip-toggle" data-value="その他">その他</button>
      </div>
      <span class="chip-hint" id="interestHint">気になるものをタップして選んでください（複数可）</span>
      <input type="hidden" name="興味のある内容" id="interestInput" required>
    </div>

    <div class="field">
      <label for="message">ご相談内容・現在のお悩みなど <span class="opt">任意</span></label>
      <textarea id="message" name="お問い合わせ内容" placeholder="現在の発信状況や、困っていることなど、わかる範囲で構いません"></textarea>
    </div>

    <div>
      <button type="submit" class="pill" id="submitBtn">この内容で送信する</button>
      <p class="privacy-note" style="margin-top:12px;">送信いただいた内容は、ご相談・ご提案のご連絡にのみ使用します。</p>
    </div>

    <div class="form-msg err" id="formError">送信に失敗しました。お手数ですが、時間をおいて再度お試しください。</div>
  </form>

  <div class="thankyou" id="thankyou">
    <h2>送信ありがとうございます。</h2>
    <p>内容を確認の上、担当より折り返しご連絡いたします。今しばらくお待ちください。</p>
  </div>

  <a class="back" href="index.html">← トップページに戻る</a>
  <div class="footlinks">
    <a href="privacy.html">プライバシーポリシー</a>
    <a href="https://ybinc.co.jp" target="_blank" rel="noopener">yB Inc. 公式サイト</a>
  </div>
</div>

<script>
(function(){
  var chips = document.querySelectorAll('.chip-toggle');
  var interestInput = document.getElementById('interestInput');
  var selected = [];

  function toggleChip(chip){
    var v = chip.getAttribute('data-value');
    var idx = selected.indexOf(v);
    if(idx > -1){
      selected.splice(idx, 1);
      chip.classList.remove('on');
    } else {
      selected.push(v);
      chip.classList.add('on');
    }
    interestInput.value = selected.join(' / ');
  }

  chips.forEach(function(chip){
    chip.addEventListener('click', function(){ toggleChip(chip); });
  });

  // Pre-select a chip if arriving from a specific CTA (e.g. ?interest=doc)
  var params = new URLSearchParams(window.location.search);
  if(params.get('interest') === 'doc'){
    var docChip = document.querySelector('.chip-toggle[data-value="まずは資料だけ見てみたい"]');
    if(docChip){ toggleChip(docChip); }
  }

  // Carry over the selected plan (e.g. ?plan=standard) from the pricing section
  var planNames = { light:'ライト', standard:'スタンダード', premium:'プレミアム', flex:'フレックス' };
  var planKey = params.get('plan');
  if(planKey && planNames[planKey]){
    document.getElementById('planInput').value = planNames[planKey] + 'プラン';
    var planNote = document.getElementById('planNote');
    planNote.textContent = '「' + planNames[planKey] + 'プラン」でのお申し込みですね。内容をご確認の上、送信してください。';
    planNote.classList.add('show');
  }

  var form = document.getElementById('contactForm');
  var submitBtn = document.getElementById('submitBtn');
  var errorMsg = document.getElementById('formError');
  var thankyou = document.getElementById('thankyou');

  // formsubmit.co redirects the browser back here with ?sent=1 once it has
  // processed a plain (non-AJAX) submission, so no fetch/XHR call is needed
  // and the form keeps working under CSPs that block external fetch calls.
  var here = window.location.origin + window.location.pathname;
  document.getElementById('nextInput').value = here + '?sent=1' + (planKey ? '&plan=' + planKey : '');

  if(params.get('sent') === '1'){
    form.style.display = 'none';
    thankyou.classList.add('show');
    thankyou.scrollIntoView({ behavior: 'instant', block: 'start' });
  }

  form.addEventListener('submit', function(e){
    if(selected.length === 0){
      e.preventDefault();
      document.getElementById('interestHint').style.color = 'var(--bad)';
      document.getElementById('interestHint').textContent = '少なくとも1つ選んでください';
      return;
    }
    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = '送信中…';
    // No preventDefault beyond this point: the browser submits the form
    // natively to formsubmit.co and follows its redirect to _next.
  });
})();

(function(){
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var fine = window.matchMedia('(hover: hover) and (pointer: fine)').matches;

  if(fine && !reduceMotion){
    document.body.classList.add('has-cursor');
    var dot = document.getElementById('cur-dot');
    var ring = document.getElementById('cur-ring');
    var rx = 0, ry = 0, tx = 0, ty = 0;

    document.addEventListener('mousemove', function(e){
      tx = e.clientX; ty = e.clientY;
      dot.style.transform = 'translate(' + tx + 'px,' + ty + 'px) translate(-50%,-50%)';
    });
    function loop(){
      rx += (tx - rx) * 0.18; ry += (ty - ry) * 0.18;
      ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)';
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    var hoverables = document.querySelectorAll('a, button');
    hoverables.forEach(function(el){
      el.addEventListener('mouseenter', function(){ document.body.classList.add('cur-hover'); });
      el.addEventListener('mouseleave', function(){ document.body.classList.remove('cur-hover'); });
    });
  }
})();
</script>
